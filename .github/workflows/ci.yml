name: Validation CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Create Clean Virtual Environment
      run: |
        python -m venv venv
        
    - name: Run Gates (Unix)
      if: runner.os != 'Windows'
      run: |
        source venv/bin/activate
        python -m pip install --upgrade pip
        python -m pip install agnara==0.1.0a8 agnara-a2a==0.1.0a8 agnara-cli==0.1.0a8 agnara-events==0.1.0a8 agnara-http==0.1.0a8 agnara-mcp==0.1.0a8 agnara-telemetry==0.1.0a8
        python -m pip install -e ".[dev]"
        python -m pip check
        ruff format --check .
        ruff check .
        pytest -v
        python src/example.py
        python -m build

    - name: Run Gates (Windows)
      if: runner.os == 'Windows'
      run: |
        .\venv\Scripts\Activate.ps1
        python -m pip install --upgrade pip
        python -m pip install agnara==0.1.0a8 agnara-a2a==0.1.0a8 agnara-cli==0.1.0a8 agnara-events==0.1.0a8 agnara-http==0.1.0a8 agnara-mcp==0.1.0a8 agnara-telemetry==0.1.0a8
        python -m pip install -e ".[dev]"
        python -m pip check
        ruff format --check .
        ruff check .
        pytest -v
        python src\example.py
        python -m build
