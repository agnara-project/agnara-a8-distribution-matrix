version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "agnara*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
